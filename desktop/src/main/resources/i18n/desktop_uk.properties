about_body_desktop=Спокійна приватна читалка електронних книжок для macOS, Windows і Linux. Вільна програма з відкритим кодом за ліцензією MIT.
about_privacy_desktop=ReadArea ніколи не підключається до інтернету. Без реклами, акаунтів і стеження. Ваша бібліотека, прогрес і нотатки зберігаються в теці на цьому комп’ютері, яку може відкрити лише ваш обліковий запис. Посилання з книжок відкриваються в браузері лише після вашого підтвердження.
