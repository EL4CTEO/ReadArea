about_body_desktop=Спокойная приватная читалка электронных книг для macOS, Windows и Linux. Свободная программа с открытым исходным кодом под лицензией MIT.
about_privacy_desktop=ReadArea никогда не подключается к интернету. Без рекламы, аккаунтов и слежки. Ваша библиотека, прогресс и заметки хранятся в папке на этом компьютере, которую может открыть только ваша учётная запись. Ссылки из книг открываются в браузере только после вашего подтверждения.
