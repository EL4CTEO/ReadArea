name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-desktop:
    name: Core and desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        # The desktop UI tests drive the real app on a virtual display and save screenshots.
        run: xvfb-run -a -s "-screen 0 1600x1000x24" ./gradlew --no-daemon -Preadarea.android=false :core:test :desktop:test

      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: |
            desktop/build/qa-screens
            desktop/build/qa-screens-rtl
            desktop/build/screens
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-desktop-reports
          path: |
            core/build/reports/tests
            desktop/build/reports/tests
          retention-days: 7

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew --no-daemon -Preadarea.android=true :app:assembleDebug :app:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: app/build/reports/tests
          retention-days: 7

  desktop-packages:
    name: Desktop installers (${{ matrix.name }})
    needs: core-desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux packages are built on the oldest supported Ubuntu so their dependencies install on older
          # distributions too.
          - { name: Linux x64, os: ubuntu-22.04 }
          - { name: Linux arm64, os: ubuntu-22.04-arm }
          - { name: Windows x64, os: windows-2022 }
          - { name: macOS arm64, os: macos-15 }
          - { name: macOS x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm xvfb

      - name: Install WiX 3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      # Builds the app image, runs its self-test through the native launcher, then the installers.
      - name: Package
        # bash everywhere: PowerShell would split -Preadarea.android=false at the dot. On Linux a virtual
        # display lets the packaging start the app once to record its class-data archive.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./gradlew --no-daemon -Preadarea.android=false :desktop:packageDesktop
          else
            ./gradlew --no-daemon -Preadarea.android=false :desktop:packageDesktop
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: desktop/build/package/dist
          retention-days: 7

