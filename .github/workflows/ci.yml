name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-desktop:
    name: Core and desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        # The desktop UI tests drive the real app on a virtual display and save screenshots.
        run: xvfb-run -a -s "-screen 0 1600x1000x24" ./gradlew --no-daemon -Preadarea.android=false :core:test :desktop:test

      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: |
            desktop/build/qa-screens
            desktop/build/screens
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-desktop-reports
          path: |
            core/build/reports/tests
            desktop/build/reports/tests
          retention-days: 7

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon -Preadarea.android=true :app:assembleDebug :app:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: app/build/reports/tests
          retention-days: 7
